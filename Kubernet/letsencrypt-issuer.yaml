apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@answerflow-ai.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    # HTTP-01 solver
    - http01:
        ingress:
          class: nginx
