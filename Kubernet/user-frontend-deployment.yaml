apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-frontend
  template:
    metadata:
      labels:
        app: user-frontend
    spec:
      containers:
        - name: user-frontend
          image: gcr.io/interview-ai-482614/user-frontend:REPLACED_BY_CICD
          imagePullPolicy: Always
          ports:
            - containerPort: 80
