<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnswerFlow AI – Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Login & Sign Up.css">
</head>
<body class="page-signup">

<div class="auth-shell">

    <!-- ═══ LEFT PANEL ═══ -->
    <aside class="left-panel signup-panel">
        <div class="lp-inner">
            <h2 class="signup-hero-title">Unlock Your Potential</h2>
            <p class="signup-hero-sub">AI-Driven Career Success</p>

            <div class="hero-image-wrap">
                <img
                    src="images/21510083051.png.png"
                    alt="AI and human working together"
                    class="hero-img"
                />
                <div class="ai-pill">
                    <span class="ai-pill-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="20" viewBox="0 0 18 20" fill="none">
<path d="M4 20L8 12.5L0 11.5L12 0H14L10 7.5L18 8.5L6 20H4Z" fill="#2B9C5D"/>
</svg></span>
                    <div class="ai-pill-content">
                        <span class="ai-pill-label">AI Suggestion Ready</span>
                        <div class="ai-progress-track">
                            <div class="ai-progress-fill"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- ═══ RIGHT PANEL ═══ -->
    <main class="right-panel">
        <div class="form-card form-card--signup">

            <!-- Brand -->
            <div class="brand-block">
                <div class="brand-logo">
                    <img src="images/logo_AnsweflowAI.jpg.png" alt="AnswerFlow AI Logo" />
                </div>
                <h1 class="brand-name">AnswerFlow<span>AI</span></h1>
                <p class="brand-tagline">AI-Powered Interview Practice</p>
                <p class="brand-welcome">Create your free account</p>
            </div>

            <!-- Full Name -->
            <div class="field-group">
                <label class="field-label" for="fullName">Full Name</label>
                <input class="field-input" type="text" id="fullName" placeholder="Your full name" autocomplete="name" />
            </div>

            <!-- Email -->
            <div class="field-group">
                <label class="field-label" for="signupEmail">Email</label>
                <input class="field-input" type="email" id="signupEmail" placeholder="you@domain.com" autocomplete="email" />
            </div>

            <!-- Password -->
            <div class="field-group">
                <label class="field-label" for="signupPwd">Password</label>
                <div class="input-with-icon">
                    <input class="field-input" type="password" id="signupPwd" placeholder="Enter password" autocomplete="new-password" />
                    <button class="eye-toggle" type="button" onclick="toggleEye('signupPwd', this)" aria-label="Show password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="field-group">
                <label class="field-label" for="confirmPwd">Confirm Password</label>
                <div class="input-with-icon">
                    <input class="field-input" type="password" id="confirmPwd" placeholder="Re-enter password" autocomplete="new-password" />
                    <button class="eye-toggle" type="button" onclick="toggleEye('confirmPwd', this)" aria-label="Show password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Role -->
            <div class="field-group">
                <label class="field-label" for="role">Role</label>
                <div class="select-wrap">
                    <select class="field-input field-select" id="role">
                        <option value="" disabled selected>Select Role</option>
                        <option>Software Engineer</option>
                        <option>Product Manager</option>
                        <option>Data Analyst</option>
                        <option>UX Designer</option>
                        <option>Marketing</option>
                        <option>Other</option>
                    </select>
                    <svg class="select-caret" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <!-- Resume Upload -->
            <div class="field-group">
                <label class="field-label">Upload Resume <em class="optional-tag">(optional)</em></label>
                <label class="dropzone" id="dropzone" for="resumeFile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span id="dropzone-label">Choose file or drag &amp; drop</span>
                    <input type="file" id="resumeFile" accept=".pdf,.doc,.docx" style="display:none" onchange="handleResume(this)" />
                </label>
            </div>

            <button class="cta-btn">Create Account</button>

            <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>

            <div class="or-divider"><span>or</span></div>

            <div class="social-row">
                <!-- Google -->
                <button class="social-pill" title="Continue with Google">
                    <svg width="20" height="20" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-3.59-13.46-8.71l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                </button>
                <!-- LinkedIn -->
                <button class="social-pill" title="Continue with LinkedIn">
                    <svg width="20" height="20" viewBox="0 0 48 48">
                        <rect width="48" height="48" rx="4" fill="#0A66C2"/>
                        <path fill="#fff" d="M12.5 18.5h5V36h-5zm2.5-8a2.9 2.9 0 110 5.8 2.9 2.9 0 010-5.8zM22 18.5h4.8v2.4h.1c.67-1.27 2.3-2.6 4.74-2.6 5.07 0 6 3.34 6 7.68V36H32.5v-8.45c0-2.02-.04-4.62-2.81-4.62s-3.24 2.2-3.24 4.47V36H22V18.5z"/>
                    </svg>
                </button>
                <!-- Microsoft -->
                <button class="social-pill" title="Continue with Microsoft">
                    <svg width="20" height="20" viewBox="0 0 21 21">
                        <rect x="1"  y="1"  width="9" height="9" fill="#F25022"/>
                        <rect x="11" y="1"  width="9" height="9" fill="#7FBA00"/>
                        <rect x="1"  y="11" width="9" height="9" fill="#00A4EF"/>
                        <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
                    </svg>
                </button>
            </div>

        </div>
    </main>

</div>

<script src="js/Login & Signup.js"></script>
</body>
</html>
